<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Report Analyzer - Professional Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --success: #51cf66;
            --warning: #ff922b;
            --danger: #ff6b6b;
            --dark: #2d3748;
            --light: #f7f9fc;
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/></pattern></defs><rect width="1200" height="600" fill="url(%23grid)"/></svg>');
            pointer-events: none;
            z-index: 0;
        }

        .container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 32px;
            color: var(--dark);
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: var(--border-radius);
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: linear-gradient(135deg, #f7f9fc 0%, #f0f1ff 100%);
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: var(--secondary);
            background: linear-gradient(135deg, #f0f1ff 0%, #e8eaff 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .upload-area.dragover {
            border-color: var(--secondary);
            background: linear-gradient(135deg, #e8eaff 0%, #dfe1ff 100%);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .upload-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .upload-subtext {
            font-size: 13px;
            color: #718096;
        }

        .file-input {
            display: none;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #cbd5e0;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e2e8f0;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .btn-upload {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin: 0 auto;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-upload:active {
            transform: translateY(0);
        }

        .file-list {
            margin-top: 30px;
        }

        .file-item {
            background: linear-gradient(135deg, #f7f9fc 0%, #f0f1ff 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
            transition: var(--transition);
        }

        .file-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .file-icon {
            font-size: 24px;
        }

        .file-name {
            font-size: 14px;
            color: var(--dark);
            word-break: break-all;
            font-weight: 600;
        }

        .file-size {
            font-size: 12px;
            color: #a0aec0;
        }

        .btn-remove {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-remove:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .success-message {
            color: var(--success);
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            display: none;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 8px;
            border-left: 4px solid var(--success);
            font-weight: 600;
            animation: slideIn 0.3s ease;
        }

        .error-message {
            color: var(--danger);
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            display: none;
            padding: 12px;
            background: #fef2f2;
            border-radius: 8px;
            border-left: 4px solid var(--danger);
            font-weight: 600;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .feature {
            text-align: center;
            padding: 10px;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 24px; }
            .upload-area { padding: 40px 20px; }
            .features { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🏥</div>
            <h1>MediAnalyze</h1>
            <p class="subtitle">Advanced Medical Report Analysis</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Drag and drop your report</div>
            <div class="upload-subtext">or click to browse your files</div>
        </div>

        <input type="file" id="fileInput" class="file-input" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" />

        <div class="divider"><span>OR</span></div>

        <div style="text-align: center;">
            <button class="btn-upload" id="browseBtn">📁 Browse Files</button>
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="success-message" id="successMessage">✓ File uploaded successfully!</div>
        <div class="error-message" id="errorMessage"></div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Instant Analysis</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Secure Storage</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">Detailed Report</div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const fileList = document.getElementById('fileList');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        let selectedFiles = [];

        browseBtn.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            if (files.length === 0) return;

            const allowedTypes = ['application/pdf', 'application/msword', 
                                 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                                 'image/jpeg', 'image/png', 'image/jpg'];
            const file = files[0];

            if (!allowedTypes.includes(file.type)) {
                showError('Please upload a valid file (PDF, DOC, DOCX, JPG, PNG)');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                showError('File size must be less than 10MB');
                return;
            }

            selectedFiles = [file];
            displayFiles();
            successMessage.style.display = 'block';
            successMessage.textContent = '✓ File ready to upload!';
        }

        function displayFiles() {
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const fileSize = (file.size / 1024).toFixed(2) + ' KB';
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">📄</div>
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${fileSize}</div>
                        </div>
                    </div>
                    <div>
                        <button class="btn-remove" onclick="removeFile(${index})">Remove</button>
                        <button class="btn-upload" onclick="uploadFile()" style="margin-left: 8px;">Upload</button>
                    </div>
                `;
                fileList.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
            successMessage.style.display = 'none';
        }

        async function uploadFile() {
            if (selectedFiles.length === 0) {
                showError('Please select a file first');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFiles[0]);

            try {
                successMessage.textContent = '⏳ Analyzing your report...';
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Upload failed');
                }

                successMessage.textContent = '✓ Analysis complete! Redirecting...';
                successMessage.style.display = 'block';
                
                if (data.analysis) {
                    const queryData = encodeURIComponent(JSON.stringify(data));
                    setTimeout(() => {
                        window.location.href = '/results?data=' + queryData;
                    }, 1500);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        function showError(message) {
            errorMessage.textContent = '✗ ' + message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
